<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Build. Play. Repeat.</title>
  <desc id="desc">Animated pixel-inspired night sky, mountains, moon, and a little running character. AI, games, and useful tools.</desc>
  <defs>
    <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#1f204c"/><stop offset=".7" stop-color="#2d3265"/><stop offset="1" stop-color="#743f83"/></linearGradient>
    <pattern id="ground" width="72" height="42" patternUnits="userSpaceOnUse"><rect width="72" height="42" fill="#405d63"/><rect width="36" height="42" fill="#36545b"/></pattern>
  </defs>
  <rect width="1200" height="360" rx="22" fill="url(#sky)"/>
  <path d="M1000 48h84v12h12v84h-12v12h-84v-12h-12V60h12z" fill="#ffcf95" opacity=".3"/>
  <path d="M1012 60h60v12h12v60h-12v12h-60v-12h-12V72h12z" fill="#ffcf95"/>
  <g fill="#fff0cd"><rect x="160" y="58" width="7" height="7"><animate attributeName="opacity" values="1;.25;1" dur="2.5s" repeatCount="indefinite"/></rect><rect x="420" y="95" width="7" height="7"><animate attributeName="opacity" values=".3;1;.3" dur="3s" repeatCount="indefinite"/></rect><rect x="810" y="42" width="7" height="7"><animate attributeName="opacity" values="1;.2;1" dur="2s" repeatCount="indefinite"/></rect></g>
  <path d="M0 310V245L175 147 350 260 540 125 760 272 935 175 1200 290v20z" fill="#1b2554"/>
  <text x="75" y="104" fill="#fff7ed" font-family="Consolas,monospace" font-size="48" font-weight="800" letter-spacing="-3">BUILD.</text>
  <text x="75" y="160" fill="#fff7ed" font-family="Consolas,monospace" font-size="48" font-weight="800" letter-spacing="-3">PLAY.</text>
  <text x="75" y="216" fill="#fff7ed" font-family="Consolas,monospace" font-size="48" font-weight="800" letter-spacing="-3">REPEAT.</text>
  <text x="76" y="248" fill="#ffca91" font-family="Consolas,monospace" font-size="16" font-weight="700" letter-spacing="3">AI · GAMES · LITTLE TOOLS</text>
  <rect y="298" width="1200" height="62" fill="url(#ground)"/><rect y="290" width="1200" height="13" fill="#83ad90"/>
  <g><animateTransform attributeName="transform" type="translate" values="65 0;1010 -4;65 0" dur="14s" repeatCount="indefinite"/>
    <rect x="0" y="264" width="44" height="25" fill="#82edcc"/><rect x="11" y="247" width="24" height="20" fill="#82edcc"/><rect x="17" y="235" width="18" height="14" fill="#82edcc"/><rect x="31" y="251" width="6" height="6" fill="#182d42"/><rect x="1" y="289" width="12" height="8" fill="#403f8b"/><rect x="32" y="289" width="12" height="8" fill="#403f8b"/>
  </g>
</svg>
